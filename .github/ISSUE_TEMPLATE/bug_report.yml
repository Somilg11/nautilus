name: Bug report
description: Something in Nautilus doesn't work the way it should
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what happened, and what you expected instead.
      placeholder: |
        1. Loaded the Netflix template
        2. Pressed Run
        3. Expected the CDN node to light up before the client
    validations:
      required: true

  - type: textarea
    id: diagram
    attributes:
      label: Diagram JSON (if the canvas is involved)
      description: Toolbar ▸ Export JSON, then paste the file contents here.
      render: json

  - type: input
    id: environment
    attributes:
      label: Browser and OS
      placeholder: Chrome 141 on macOS 15
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Canvas / editing
        - Flow simulation
        - AI assistant
        - Templates
        - Import / export / share
        - Docs
        - Other
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: Console errors
      description: Anything red in the browser devtools console.
      render: shell
