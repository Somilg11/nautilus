name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # What ships to users must be clean at high severity.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # Build and lint tooling never reaches a browser, and some advisories
      # there have no patched release (braces, via the Next.js lint plugin).
      # Still fail on anything critical.
      - name: Audit development dependencies
        run: npm audit --audit-level=critical
